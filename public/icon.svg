<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="letterRGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  {/* Outer Dark Background */}
  <rect width="100" height="100" rx="24" fill="#020617" />

  {/* Background Shield Outline */}
  <path
    d="M50 10 L85 24 V48 C85 70 70 86 50 94 C30 86 15 70 15 48 V24 L50 10 Z"
    fill="#0f172a"
    stroke="url(#shieldGrad)"
    stroke-width="4"
    stroke-linejoin="round"
  />

  {/* Tech Nodes & Circuit Connectors */}
  <circle cx="50" cy="20" r="2.5" fill="#38bdf8" />
  <circle cx="28" cy="32" r="2.5" fill="#ef4444" />
  <circle cx="72" cy="32" r="2.5" fill="#f59e0b" />
  <circle cx="50" cy="84" r="2.5" fill="#10b981" />

  <path d="M50 20 L50 26" stroke="url(#circuitGrad)" stroke-width="1.5" stroke-dasharray="2 2" />
  <path d="M28 32 L36 36" stroke="url(#circuitGrad)" stroke-width="1.5" />
  <path d="M72 32 L64 36" stroke="url(#circuitGrad)" stroke-width="1.5" />
  <path d="M50 84 L50 78" stroke="url(#circuitGrad)" stroke-width="1.5" />

  {/* Styled Letter 'R' for Rqeeb / Engineering Consulting */}
  <path
    d="M36 32 V70 M36 32 H54 C62 32 66 37 66 44 C66 51 62 55 54 55 H36 M50 55 L66 70"
    stroke="url(#letterRGrad)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  {/* Inner Glowing Core Dot */}
  <circle cx="50" cy="43.5" r="2" fill="#ef4444" />
</svg>
